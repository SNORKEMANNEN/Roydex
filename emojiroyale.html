<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Emoji Guesser</title>
    
    <!-- Import Clash-style font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    
    <!-- Import three.js for 3D elements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --clash-blue: #0a4b9c;
            --clash-gold: #ffd700;
            --clash-wood: #8b4513;
            --clash-wood-dark: #5a2d0c;
            --clash-red: #e53935;
            --clash-green: #4caf50;
            --clash-stone: #4d4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 1px;
        }

        body {
            background-color: var(--clash-blue);
            background-image: linear-gradient(145deg, var(--clash-blue) 0%, #052a5a 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 3D Canvas for background element */
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        /* Animated elixir drops */
        .elixir-drop {
            position: absolute;
            background-color: #f020f0;
            width: 15px;
            height: 25px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 10px #f020f0, 0 0 20px #f020f0;
            opacity: 0;
            z-index: 2;
            animation: float 10s infinite linear;
        }

        .elixir-drop:nth-child(1) { left: 10%; animation-duration: 12s; animation-delay: 0s; }
        .elixir-drop:nth-child(2) { left: 20%; animation-duration: 8s; animation-delay: -3s; }
        .elixir-drop:nth-child(3) { left: 30%; animation-duration: 15s; animation-delay: -7s; }
        .elixir-drop:nth-child(4) { left: 70%; animation-duration: 10s; animation-delay: -5s; }
        .elixir-drop:nth-child(5) { left: 80%; animation-duration: 9s; animation-delay: -1s; }
        .elixir-drop:nth-child(6) { left: 90%; animation-duration: 13s; animation-delay: -8s; }

        @keyframes float {
            0% {
                transform: translateY(110vh) rotate(-30deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-10vh) rotate(30deg);
                opacity: 0;
            }
        }

        /* Main game container */
        #game-container {
            background-image: linear-gradient(180deg, var(--clash-wood), var(--clash-wood-dark));
            border: 8px solid var(--clash-gold);
            border-radius: 25px;
            padding: 2rem 2.5rem;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 
                        inset 0 0 15px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
            border-style: outset;
        }

        /* Title with a "crown" */
        #game-title {
            font-size: 2.5rem;
            color: var(--clash-gold);
            text-shadow: 0 0 5px #000, 0 0 10px #000, 0 4px 5px #4a2509;
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        #game-title::before {
            content: '👑';
            display: inline-block;
            transform: rotate(-15deg);
            margin-right: -10px;
            font-size: 2rem;
        }
        
        #game-title::after {
            content: '👑';
            display: inline-block;
            transform: scaleX(-1) rotate(-15deg);
            margin-left: -10px;
            font-size: 2rem;
        }

        #score-display {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 1.5rem;
            background: var(--clash-blue);
            padding: 5px 15px;
            border-radius: 15px;
            border: 3px solid var(--clash-gold);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            color: var(--clash-gold);
            text-shadow: 0 2px 2px #000;
        }

        #emoji-display {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 15px;
            border: 4px solid var(--clash-stone);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #guess-input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1.25rem;
            border-radius: 10px;
            border: 4px solid var(--clash-stone);
            background-color: #f0f0f0;
            color: var(--clash-stone);
            text-align: center;
            margin-bottom: 1.5rem;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.3);
        }
        
        #guess-input::placeholder {
            color: #999;
            opacity: 1;
        }

        .button-container {
            display: flex;
            justify-content: space-around;
            gap: 1rem;
        }

        /* Advanced 3D Button Styling */
        .game-button {
            flex: 1;
            font-size: 1.5rem;
            padding: 0.8rem 1rem;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
            position: relative;
            text-shadow: 0 2px 3px rgba(0,0,0,0.5);
        }

        .game-button.guess {
            background-image: linear-gradient(180deg, var(--clash-green), #388e3c);
            /* This pseudo-element creates the 3D "bottom edge" */
            box-shadow: 0 6px 0 #2e7d32; 
        }

        .game-button.skip {
            background-image: linear-gradient(180deg, var(--clash-red), #c62828);
            box-shadow: 0 6px 0 #b71c1c;
        }

        /* Button Hover Animation */
        .game-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #b71c1c; /* Taller shadow */
            filter: brightness(1.1);
        }
        
        .game-button.guess:hover {
             box-shadow: 0 10px 0 #2e7d32;
        }

        /* Button Click (Active) Animation */
        .game-button:active {
            transform: translateY(2px); /* Moves down */
            box-shadow: 0 2px 0 #b71c1c; /* Short shadow, looks "pressed" */
            filter: brightness(0.9);
        }

        .game-button.guess:active {
            box-shadow: 0 2px 0 #2e7d32;
        }


        #message-area {
            font-size: 1.25rem;
            margin-top: 1.5rem;
            min-height: 2em;
            text-shadow: 0 2px 2px #000;
        }

        .message.correct {
            color: var(--clash-green);
        }

        .message.incorrect {
            color: var(--clash-red);
        }
        
        .message.info {
            color: var(--clash-gold);
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            #game-container {
                padding: 1.5rem;
                width: 95%;
            }
            #game-title {
                font-size: 2rem;
            }
            #game-title::before, #game-title::after {
                font-size: 1.5rem;
            }
            #score-display {
                font-size: 1.2rem;
                padding: 3px 10px;
                top: 5px;
                right: 10px;
            }
            #emoji-display {
                font-size: 3rem;
                min-height: 80px;
            }
            #guess-input {
                font-size: 1.1rem;
            }
            .button-container {
                flex-direction: column;
            }
            .game-button {
                font-size: 1.25rem;
            }
        }

    </style>
</head>
<body>

    <!-- 3D Background Canvas -->
    <canvas id="three-canvas"></canvas>

    <!-- Animated Background Elements -->
    <div class="elixir-drop"></div>
    <div class="elixir-drop"></div>
    <div class="elixir-drop"></div>
    <div class="elixir-drop"></div>
    <div class="elixir-drop"></div>
    <div class="elixir-drop"></div>

    <!-- Game UI -->
    <main id="game-container">
        <h1 id="game-title">Guess the Card!</h1>
        <div id="score-display">Score: 0</div>
        
        <div id="emoji-display">👑🏹</div>
        
        <input type="text" id="guess-input" placeholder="Type your guess...">
        
        <div class="button-container">
            <button class="game-button guess" id="guess-button">Guess!</button>
            <button class="game-button skip" id="skip-button">Skip</button>
        </div>
        
        <p id="message-area" class="message"></p>
    </main>

    <script>
        // --- Game Logic ---

        const cardDatabase = [
            { emojis: "👑🏹", name: "Princess" },
            { emojis: "💀💀💀", name: "Skeleton Army" },
            { emojis: "🐷🔨", name: "Hog Rider" },
            { emojis: "🎈💣", name: "Balloon" },
            { emojis: "⚡️🧙‍♂️", name: "Electro Wizard" },
            { emojis: "🤖✨", name: "P.E.K.K.A" },
            { emojis: "🪵🎯", name: "The Log" },
            { emojis: "🔥🐲", name: "Inferno Dragon" },
            { emojis: "🥶🧙‍♂️", name: "Ice Wizard" },
            { emojis: "🦇🦇", name: "Bats" },
            { emojis: "🗿💥", name: "Golem" },
            { emojis: "⚔️", name: "Knight" },
            { emojis: "🏹🏹", name: "Archers" },
            { emojis: "🔥👻", name: "Fire Spirit" },
            { emojis: " goblin ", name: "Goblin Barrel" },
            { emojis: "⛏️", name: "Miner" },
            { emojis: "👻👑", name: "Royal Ghost" },
            { emojis: "💣💀", name: "Giant Skeleton" },
            { emojis: "✨", name: "Mirror" },
            { emojis: "😡", name: "Rage" },
            { emojis: "🥶", name: "Freeze" },
            { emojis: "🐎⚔️", name: "Dark Prince" },
            { emojis: "🐎🛡️", name: "Prince" },
            { emojis: "🧙‍♂️", name: "Wizard" },
            { emojis: "mini 🤖", name: "Mini P.E.K.K.A" },
            { emojis: "🔥", name: "Fireball" },
            { emojis: "⚡️", name: "Zap" },
            { emojis: "🏹🎯", name: "X-Bow" }
        ];

        let currentCard = {};
        let score = 0;
        let availableCards = [];

        // Get DOM Elements
        const emojiDisplay = document.getElementById('emoji-display');
        const guessInput = document.getElementById('guess-input');
        const guessButton = document.getElementById('guess-button');
        const skipButton = document.getElementById('skip-button');
        const messageArea = document.getElementById('message-area');
        const scoreDisplay = document.getElementById('score-display');
        
        let isChecking = false; // Prevent multiple clicks

        function loadNewCard() {
            isChecking = true; // Disable buttons temporarily
            
            // Refill available cards if empty
            if (availableCards.length === 0) {
                availableCards = [...cardDatabase];
            }

            // Pick and remove a random card
            const cardIndex = Math.floor(Math.random() * availableCards.length);
            currentCard = availableCards.splice(cardIndex, 1)[0];

            // Display
            emojiDisplay.textContent = currentCard.emojis;
            guessInput.value = '';
            messageArea.textContent = '';
            messageArea.className = 'message';
            guessInput.focus();
            
            isChecking = false; // Re-enable
        }

        function checkGuess() {
            if (isChecking) return;
            
            const userGuess = guessInput.value.trim().toLowerCase();
            const correctName = currentCard.name.trim().toLowerCase();

            // Simple check for P.E.K.K.A
            const altCorrectName = correctName.replace(/\./g, ''); // "pekka"
            
            if (userGuess === correctName || userGuess === altCorrectName) {
                // Correct
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                messageArea.textContent = 'Correct!';
                messageArea.className = 'message correct';
                isChecking = true;
                setTimeout(loadNewCard, 1000);
            } else {
                // Incorrect
                messageArea.textContent = 'Try again!';
                messageArea.className = 'message incorrect';
                // Add a shake animation for effect
                document.getElementById('game-container').animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], {
                    duration: 300,
                    easing: 'ease-in-out'
                });
            }
        }

        function skipCard() {
            if (isChecking) return;
            
            messageArea.textContent = `The card was: ${currentCard.name}`;
            messageArea.className = 'message info';
            isChecking = true;
            setTimeout(loadNewCard, 1500);
        }

        // Event Listeners
        guessButton.addEventListener('click', checkGuess);
        skipButton.addEventListener('click', skipCard);
        guessInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });
        
        // Initial load
        window.addEventListener('load', () => {
             loadNewCard();
        });


        // --- Three.js 3D Background ---

        let scene, camera, renderer, crystal;

        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2.5;

            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('three-canvas'),
                alpha: true // Transparent background
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Elixir Crystal
            const geometry = new THREE.OctahedronGeometry(1.2, 0);
            const material = new THREE.MeshStandardMaterial({
                color: 0xda00ff, // Elixir purple
                emissive: 0x7b0091,
                roughness: 0.3,
                metalness: 0.1
            });
            crystal = new THREE.Mesh(geometry, material);
            scene.add(crystal);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Start animation
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate the crystal
            crystal.rotation.x += 0.003;
            crystal.rotation.y += 0.005;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        
        // --- Init 3D and Game ---
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('load', initThreeJS);

    </script>
</body>
</html>
